<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma virtual</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <img src="ic_task_completed.png" alt="Logo" class="logo" />
      <div class="toggle-box">
        <div class="toggle-panel toggle-left">
          <h1>¡Hola, Bienvenido a Deposito Teach!</h1>
          <p>Para poder registrarte debes comunicarte con soporte</p>
        </div>
      </div>
      <div class="form-box login">
        <form id="login-form">
          <h1>Acceso a su cuenta</h1>
          <div class="input-box">
            <input type="text" id="usuario" placeholder="Nombre de usuario" required />
            <i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input type="password" id="password" placeholder="Contraseña" required />
            <i class="bx bxs-lock-alt"></i>
          </div>
          <div class="forgot-link">
            <a href="#">¿Has olvidado la contraseña?</a>
          </div>
          <button type="submit" class="btn">Acceder</button>
        </form>
      </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
